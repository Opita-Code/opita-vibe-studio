<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas de Actualización — Vibe Studio | Opita Code</title>
  <meta name="description" content="Historial de cambios y notas de actualización de Vibe Studio. Cada versión con sus nuevas funcionalidades y mejoras.">
  <meta name="theme-color" content="#09090b">
  <link rel="canonical" href="https://vibe.opitacode.com/changelog.html">
  <link rel="icon" type="image/svg+xml" href="/vibe-logo.svg" />
  <meta property="og:type" content="website">
  <meta property="og:title" content="Changelog — Vibe Studio">
  <meta property="og:description" content="Historial de versiones de Vibe Studio.">
  <meta property="og:locale" content="es_CO">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { obsidian: { 800: '#1a1a2e', 900: '#09090b' }, aura: { cyan: '#06b6d4', purple: '#a855f7', blue: '#3b82f6' } },
        fontFamily: { geist: ['Geist', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
      }}
    }
  </script>
  <style>
    body { font-family: 'Geist', system-ui, sans-serif; background: #09090b; color: #e4e4e7; }
    .comp-badge-web { --c: #06b6d4; }
    .comp-badge-backend { --c: #a855f7; }
    .comp-badge-landing { --c: #f59e0b; }
    .comp-badge-desktop { --c: #3b82f6; }
    .comp-badge { background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); }
    details summary { cursor: pointer; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details[open] .chevron { transform: rotate(90deg); }
  </style>
</head>
<body class="min-h-screen bg-obsidian-900 text-white/90 antialiased">
  <nav class="fixed top-0 inset-x-0 z-50 backdrop-blur-2xl bg-obsidian-900/80 border-b border-white/5">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <img src="/vibe-logo.svg" alt="Vibe Studio" class="w-7 h-7">
        <span class="font-medium text-lg">Vibe Studio</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/" class="text-sm text-white/50 hover:text-white/80 transition-colors">← Volver</a>
        <a href="/app/" class="text-sm px-4 py-1.5 rounded-full bg-white/10 hover:bg-white/20 transition-colors">Abrir App</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 pt-32 pb-24">
    <h1 class="text-4xl md:text-5xl font-semibold tracking-tight mb-2">Notas de Actualización</h1>
    <p class="text-white/40 text-lg mb-16">Cada versión, documentada. Así construimos Vibe Studio.</p>
    <div id="changelog" class="space-y-0"></div>
  </main>

  <footer class="border-t border-white/5 py-8 text-center text-xs text-white/30">
    <p>Hecho con 🇨🇴 por <a href="https://opitacode.com" class="text-aura-cyan/70 hover:text-aura-cyan">Opita Code</a></p>
  </footer>

  <script>
    const COMP_CLASSES = { 'Web App': 'comp-badge-web', 'Backend': 'comp-badge-backend', 'Landing': 'comp-badge-landing', 'Desktop': 'comp-badge-desktop' };

    async function render() {
      const el = document.getElementById('changelog');
      try {
        const releases = await (await fetch('/changelog.json')).json();
        el.innerHTML = releases.map((r, i) => `
          <article class="relative pl-8 pb-14 ${i < releases.length - 1 ? 'border-l border-white/10' : 'border-l border-transparent'}">
            <div class="absolute -left-[5px] top-1.5 w-[10px] h-[10px] rounded-full ${i === 0 ? 'bg-aura-cyan shadow-[0_0_12px_rgba(6,182,212,0.6)]' : 'bg-white/20'}"></div>

            <div class="flex flex-wrap items-center gap-3 mb-4">
              <span class="font-mono text-base font-medium ${i === 0 ? 'text-aura-cyan' : 'text-white/70'}">v${r.version}</span>
              <span class="text-xs text-white/30">${new Date(r.date + 'T12:00:00').toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
              ${i === 0 ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-aura-cyan/10 text-aura-cyan border border-aura-cyan/20 font-medium">Última</span>' : ''}
            </div>

            <h2 class="text-2xl font-medium text-white/90 mb-3">${r.title}</h2>

            <!-- Component badges -->
            <div class="flex flex-wrap gap-2 mb-5">
              ${r.components.map(c => `<span class="comp-badge ${COMP_CLASSES[c.name] || ''} text-[11px] px-2.5 py-0.5 rounded-full font-mono">${c.name} <span class="opacity-50">${c.tag}</span></span>`).join('')}
            </div>

            <!-- Highlights -->
            <ul class="space-y-2 mb-4">
              ${r.highlights.map(h => `
                <li class="flex items-start gap-2.5 text-sm text-white/60">
                  <svg class="w-4 h-4 text-aura-cyan/50 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  <span>${h}</span>
                </li>
              `).join('')}
            </ul>

            <!-- Expandable details per component -->
            ${Object.entries(r.details).map(([comp, items]) => `
              <details class="group mb-2">
                <summary class="flex items-center gap-2 text-xs text-white/30 hover:text-white/50 transition-colors py-1">
                  <svg class="w-3 h-3 chevron transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  ${comp} — ${items.length} cambio${items.length > 1 ? 's' : ''}
                </summary>
                <ul class="pl-5 pt-1 pb-2 space-y-1.5">
                  ${items.map(it => `
                    <li class="text-xs text-white/40 flex items-start gap-2">
                      <span class="text-white/15 mt-1">•</span>
                      <span>${it}</span>
                    </li>
                  `).join('')}
                </ul>
              </details>
            `).join('')}
          </article>
        `).join('');
      } catch (e) {
        el.innerHTML = '<p class="text-white/30">No se pudieron cargar las notas.</p>';
      }
    }
    render();
  </script>
</body>
</html>
