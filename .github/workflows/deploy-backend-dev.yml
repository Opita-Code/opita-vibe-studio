name: Deploy Backend Dev (SST)

on:
  push:
    branches: [main]
    paths:
      - 'packages/vibe-ai-backend/**'
      - 'sst.config.ts'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy Backend to AWS Dev Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SST (Dev)
        run: npx sst deploy --stage dev
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          API_GOOGLE_CLOUD: ${{ secrets.API_GOOGLE_CLOUD }}
          AI_STUDIO_GOOGLE: ${{ secrets.AI_STUDIO_GOOGLE }}
          GEMINI_API_KEY: ${{ secrets.API_GOOGLE_CLOUD }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_WEBHOOK_SECRET: ${{ secrets.WOMPI_WEBHOOK_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          OPITA_LINKS_API_KEY: ${{ secrets.OPITA_LINKS_API_KEY }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          STAGING_WHITELIST: ${{ secrets.STAGING_WHITELIST }}

      - name: Verify Dev API Health
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  DEV POST-DEPLOY VERIFICATION"
          echo "═══════════════════════════════════════════════"
          
          echo "🌐 Waiting for api-dev.opitacode.com to be reachable..."
          DNS_OK=false
          for i in {1..25}; do
            # Try to curl the endpoint. If it resolves and connects, curl returns HTTP status (non-000).
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api-dev.opitacode.com/core/auth/me || true)
            if [ "$HTTP_CODE" != "000" ]; then
              echo "  ✅ api-dev.opitacode.com is reachable! (HTTP: $HTTP_CODE)"
              DNS_OK=true
              break
            fi
            echo "  [Attempt $i/25] api-dev.opitacode.com not reachable yet. Waiting 12s..."
            sleep 12
          done

          if [ "$DNS_OK" = "false" ]; then
            echo "  ❌ ERROR: api-dev.opitacode.com failed to become reachable after 5 minutes."
            echo "  This is likely because CNAME records are hosted on Cloudflare and api-dev.opitacode.com"
            echo "  needs to be manually added in the Cloudflare DNS panel as a CNAME to the dev CloudFront router."
            exit 1
          fi

          FAILURES=0

          # 1. Core API reachable
          echo ""
          echo "── 1/3 Core API (Dev) ──"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api-dev.opitacode.com/core/auth/me || true)
          echo "  /core/auth/me → $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "502" ]; then
            echo "  ❌ FAIL: Dev Core API returned $HTTP_CODE"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Dev Core API reachable (Status: $HTTP_CODE)"
          fi

          # 2. Chat health check — verifies providers have valid keys
          echo ""
          echo "── 2/3 Chat Providers (Dev) ──"
          CHAT_RESPONSE=$(curl -s -X POST https://api-dev.opitacode.com/chat/ \
            -H "Content-Type: application/json" \
            -H "Origin: https://dev.opitacode.com" \
            -d '{"action":"health_check"}' || echo '{"status":"error"}')
          echo "  Response: $CHAT_RESPONSE"

          # Parse provider status
          DEEPSEEK=$(echo "$CHAT_RESPONSE" | grep -o '"deepseek":true' || true)
          GEMINI=$(echo "$CHAT_RESPONSE" | grep -o '"gemini":true' || true)
          STATUS=$(echo "$CHAT_RESPONSE" | grep -o '"status":"ok"' || true)

          if [ -z "$STATUS" ]; then
            echo "  ❌ FAIL: Dev Chat Lambda not responding correctly"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Dev Chat Lambda healthy"
          fi

          if [ -z "$GEMINI" ]; then
            echo "  ❌ FAIL: Gemini API key missing or not configured in Dev"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Gemini provider configured"
          fi

          if [ -z "$DEEPSEEK" ]; then
            echo "  ⚠️  WARN: DeepSeek key missing in Dev (fallback unavailable)"
          else
            echo "  ✅ DeepSeek provider configured"
          fi

          # 3. Billing API reachable
          echo ""
          echo "── 3/3 Billing API (Dev) ──"
          BILL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api-dev.opitacode.com/billing/sign?product=VIBE_STUDENT&userId=health-check" || echo "000")
          echo "  /billing/sign → $BILL_CODE"
          if [ "$BILL_CODE" = "000" ] || [ "$BILL_CODE" = "502" ]; then
            echo "  ❌ FAIL: Dev Billing API unreachable or returned $BILL_CODE"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Dev Billing API reachable (Status: $BILL_CODE)"
          fi

          # Final verdict
          echo ""
          echo "═══════════════════════════════════════════════"
          if [ "$FAILURES" -gt 0 ]; then
            echo "  ❌ DEV DEPLOY VERIFICATION FAILED ($FAILURES checks)"
            echo "  The deploy completed but critical services are broken in Dev."
            echo "  Check API keys in GitHub Secrets and redeploy."
            echo "═══════════════════════════════════════════════"
            exit 1
          fi
          echo "  ✅ ALL CHECKS PASSED — Dev Staging is healthy"
          echo "═══════════════════════════════════════════════"
