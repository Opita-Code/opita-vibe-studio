name: CI (Tests & Quality Gates)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# REGLA DURA (2026-08-03): Playwright ABOLIDO para tests. La validación
# browser/E2E se hace con dark-copilot (MCP Chromium real) en la máquina
# del operador. CI queda: typecheck + unit + backend typecheck.
jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Unit Tests
        run: npm run test

      - name: Backend Typecheck
        run: cd packages/vibe-ai-backend && npm run typecheck

