name: Deploy Backend Prod (SST)

on:
  push:
    tags: ['backend/v*']
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy Backend to AWS Prod Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SST (Prod)
        run: npx sst deploy --stage prod
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Centralized LLM secrets (2026-08-04): prod reads /opita-llm/*
          # from SSM in sst.config.ts (withDecryption). The GH secrets below
          # are kept as fallback ONLY for dev/staging (prod throws if SSM
          # missing). Rotate keys in SSM /opita-llm/* — not here.
          DEEP_SEEK_KEY: ${{ secrets.DEEP_SEEK_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          API_GOOGLE_CLOUD: ${{ secrets.API_GOOGLE_CLOUD }}
          AI_STUDIO_GOOGLE: ${{ secrets.AI_STUDIO_GOOGLE }}
          GEMINI_API_KEY: ${{ secrets.API_GOOGLE_CLOUD }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_WEBHOOK_SECRET: ${{ secrets.WOMPI_WEBHOOK_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          OPITA_LINKS_API_KEY: ${{ secrets.OPITA_LINKS_API_KEY }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          STAGING_WHITELIST: ${{ secrets.STAGING_WHITELIST }}

      - name: Verify Prod API Health
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  PRODUCTION POST-DEPLOY VERIFICATION"
          echo "═══════════════════════════════════════════════"
          FAILURES=0

          # Captura las URLs reales de las Lambdas desde el estado SST (Stack outputs).
          # api.opitacode.com pasa por el CloudFront de opita-account-ui
          # (E1VRLLH35PTCWT) cuyos origins apuntan a estas URLs — verificar
          # ambos: el endpoint público (e2e) y la Lambda directa (sin CF).
          SST_OUTPUTS=$(npx sst state export --stage prod 2>/dev/null | python -c "
import sys, json
d = json.load(sys.stdin)
for r in d.get('latest', {}).get('resources', []):
    if r.get('type') == 'pulumi:pulumi:Stack':
        for k, v in (r.get('outputs') or {}).items():
            print(f'{k}: {v}')
" 2>/dev/null)
          echo "SST outputs:"
          echo "$SST_OUTPUTS"

          CORE_API_URL=$(echo "$SST_OUTPUTS" | grep '^CoreApiUrl:' | awk '{print $2}' | tr -d ' ')
          CHAT_API_URL=$(echo "$SST_OUTPUTS" | grep '^ChatApiUrl:' | awk '{print $2}' | tr -d ' ')
          BILLING_API_URL=$(echo "$SST_OUTPUTS" | grep '^BillingApiUrl:' | awk '{print $2}' | tr -d ' ')

          # 0. Lambda directa reachable (sin CloudFront)
          echo ""
          echo "── 0/4 Lambdas directas (Prod) ──"
          if [ -n "$CORE_API_URL" ]; then
            DIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${CORE_API_URL}core/auth/me" || true)
            echo "  CoreAPI direct → $DIRECT_CODE"
            if [ "$DIRECT_CODE" = "000" ] || [ "$DIRECT_CODE" = "502" ]; then
              echo "  ❌ FAIL: Prod CoreAPI Lambda directa murió"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ✅ Prod CoreAPI Lambda viva"
            fi
          else
            echo "  ⚠️  No se pudo leer CoreApiUrl de sst outputs (skip check directo)"
          fi

          # 1. Core API reachable vía api.opitacode.com (CloudFront opita-account)
          echo ""
          echo "── 1/4 Core API (Prod, vía CF) ──"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.opitacode.com/core/auth/me)
          echo "  /core/auth/me → $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "  ❌ FAIL: Prod Core API unreachable"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Prod Core API reachable"
          fi

          # 2. Chat health check — verifies providers have valid keys
          echo ""
          echo "── 2/4 Chat Providers (Prod) ──"
          CHAT_RESPONSE=$(curl -s -X POST https://api.opitacode.com/chat/ \
            -H "Content-Type: application/json" \
            -H "Origin: https://vibe.opitacode.com" \
            -d '{"action":"health_check"}')
          echo "  Response: $CHAT_RESPONSE"

          # Parse provider status
          DEEPSEEK=$(echo "$CHAT_RESPONSE" | grep -o '"deepseek":true' || true)
          GEMINI=$(echo "$CHAT_RESPONSE" | grep -o '"gemini":true' || true)
          STATUS=$(echo "$CHAT_RESPONSE" | grep -o '"status":"ok"' || true)

          if [ -z "$STATUS" ]; then
            echo "  ❌ FAIL: Prod Chat Lambda not responding correctly"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Prod Chat Lambda healthy"
          fi

          if [ -z "$GEMINI" ]; then
            echo "  ❌ FAIL: Gemini API key missing or not configured in Prod"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Gemini provider configured"
          fi

          if [ -z "$DEEPSEEK" ]; then
            echo "  ⚠️  WARN: DeepSeek key missing in Prod (fallback unavailable)"
          else
            echo "  ✅ DeepSeek provider configured"
          fi

          # 3. Billing API reachable
          echo ""
          echo "── 3/4 Billing API (Prod) ──"
          BILL_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.opitacode.com/billing/sign?product=VIBE_STUDENT&userId=health-check")
          echo "  /billing/sign → $BILL_CODE"
          if [ "$BILL_CODE" = "000" ]; then
            echo "  ❌ FAIL: Prod Billing API unreachable"
            FAILURES=$((FAILURES + 1))
          else
            echo "  ✅ Prod Billing API reachable"
          fi

          # Final verdict
          echo ""
          echo "═══════════════════════════════════════════════"
          if [ "$FAILURES" -gt 0 ]; then
            echo "  ❌ PRODUCTION DEPLOY VERIFICATION FAILED ($FAILURES checks)"
            echo "  The deploy completed but critical services are broken in Prod."
            echo "  Check API keys in GitHub Secrets and redeploy."
            echo "═══════════════════════════════════════════════"
            exit 1
          fi
          echo "  ✅ ALL CHECKS PASSED — Production is healthy"
          echo "═══════════════════════════════════════════════"
