name: Deploy Web App Dev

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web-app-dev.yml'
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy Web App to Dev Staging S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Deploy Info
        run: |
          echo "🚀 Web App Dev Deploy"
          echo "   Ref: ${{ github.ref_name }}"
          echo "   SHA: ${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend (Staging Mode)
        run: npx vite build --mode staging

      - name: Verify Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html not found — build failed silently"
            exit 1
          fi
          echo "✅ dist/index.html exists ($(wc -c < dist/index.html) bytes)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # CRITICAL: Sync ONLY to /app/ in dev.opitacode.com.
      # The dev landing page lives at the bucket root.
      - name: Deploy App to Dev S3 (/app/ only)
        run: aws s3 sync dist/ s3://dev.opitacode.com/app/ --delete

      - name: Invalidate Dev CloudFront Cache (App)
        run: aws cloudfront create-invalidation --distribution-id EHQLGHNKD091K --paths "/app/*"

      - name: Verify Deployment
        run: |
          echo "Waiting 5s for Dev CDN propagation..."
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://dev.opitacode.com/app/)
          echo "  /app/ returned: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Dev web app returned $HTTP_CODE (may need more CDN propagation time)"
          else
            echo "✅ Dev web app deployed and reachable at https://dev.opitacode.com/app/"
          fi
